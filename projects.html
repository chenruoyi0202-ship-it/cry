<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Projects</title>
<meta property="og:title" content="My Projects">
<meta property="og:description" content="一些自己做的小工具合集">
<meta property="og:image" content="https://chenruoyi0202-ship-it.github.io/cry/projects-icon.png">
<meta property="og:url" content="https://chenruoyi0202-ship-it.github.io/cry/projects.html">
<link rel="icon" href="projects-icon.png">
<link rel="apple-touch-icon" href="projects-icon.png">
<script>
  (function(){
    function apply(){
      if(window.matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.setAttribute('data-theme','light');
      else document.documentElement.removeAttribute('data-theme');
    }
    apply();
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',apply);
  })();
</script>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#07070a;
    --card:#0e0e14;
    --border:rgba(255,255,255,0.06);
    --text:#e8eaf0;
    --text-muted:#6b7394;
    --text-grad-from:#e8eaf0;
    --text-grad-to:#a0a8c4;
    --dot:rgba(255,255,255,0.03);
    --arrow-bg:rgba(255,255,255,0.04);
    --arrow-bg-hover:rgba(255,255,255,0.08);
    --orb-opacity:.35;
    --radius:24px;
  }
  [data-theme="light"]{
    --bg:#fafafe;
    --card:#ffffff;
    --border:rgba(15,23,42,0.08);
    --text:#1a1a2e;
    --text-muted:#6b7394;
    --text-grad-from:#1a1a2e;
    --text-grad-to:#5a6280;
    --dot:rgba(15,23,42,0.05);
    --arrow-bg:rgba(15,23,42,0.04);
    --arrow-bg-hover:rgba(15,23,42,0.08);
    --orb-opacity:.25;
  }
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'SF Pro Display','SF Pro Text',-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100dvh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    transition:background .4s ease,color .4s ease;
  }

  /* ── Background ── */
  .bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;contain:strict}
  .orb{position:absolute;border-radius:50%;opacity:var(--orb-opacity)}
  .orb-1{width:300px;height:300px;background:radial-gradient(circle,#c084fc 0%,transparent 70%);top:-60px;left:-40px;filter:blur(60px)}
  .orb-2{width:280px;height:280px;background:radial-gradient(circle,#CA8A04 0%,transparent 70%);bottom:-60px;right:-30px;filter:blur(60px)}
  .orb-3{width:240px;height:240px;background:radial-gradient(circle,#43b89c 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);filter:blur(60px)}

  /* ── Layout ── */
  .page{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:20px 20px}

  /* ── Header ── */
  .header{text-align:center;margin-bottom:16px;animation:fadeUp .4s ease-out both}
  .header-icon{font-size:28px;margin-bottom:4px;display:block}
  .header h1{
    font-size:clamp(22px,5vw,38px);font-weight:700;
    letter-spacing:-.5px;
    background:linear-gradient(135deg,var(--text-grad-from) 0%,var(--text-grad-to) 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .header p{
    margin-top:4px;font-size:12px;color:var(--text-muted);
    letter-spacing:.3px;line-height:1.5;
  }

  /* ── Sections ── */
  .sections{
    display:flex;flex-direction:column;gap:18px;
    width:100%;max-width:460px;
  }
  .section{display:flex;flex-direction:column;gap:10px;animation:fadeUp .35s ease-out both}
  .section:nth-child(1){animation-delay:.05s}
  .section:nth-child(2){animation-delay:.12s}
  .section-title{
    display:flex;align-items:center;gap:8px;
    padding:0 4px;
    font-size:10px;font-weight:600;
    letter-spacing:1.5px;text-transform:uppercase;
    color:var(--text-muted);
  }
  .section-title::before{
    content:'';width:3px;height:10px;border-radius:2px;
    background:linear-gradient(180deg,var(--section-c1),var(--section-c2));
  }
  .section-title .count{
    font-size:9px;padding:1px 6px;border-radius:10px;
    background:var(--arrow-bg);color:var(--text-muted);
    letter-spacing:.5px;
  }
  .section--life{--section-c1:#c084fc;--section-c2:#818cf8}
  .section--invest{--section-c1:#CA8A04;--section-c2:#FBBF24}

  /* ── Cards Grid ── */
  .cards{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    width:100%;
  }

  /* ── Card ── */
  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:14px 16px;
    display:flex;flex-direction:row;align-items:center;gap:13px;
    transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease,border-color .35s ease,background .4s ease;
    cursor:pointer;
    text-decoration:none;color:inherit;
    overflow:hidden;
    animation:fadeUp .3s ease-out both;
  }
  [data-theme="light"] .card{box-shadow:0 2px 12px rgba(15,23,42,0.04)}
  .card:nth-child(1){animation-delay:.03s}
  .card:nth-child(2){animation-delay:.06s}
  .card:nth-child(3){animation-delay:.09s}
  .card:nth-child(4){animation-delay:.12s}
  .card:nth-child(5){animation-delay:.15s}

  .card::before{
    content:'';position:absolute;inset:0;
    border-radius:var(--radius);
    opacity:0;transition:opacity .4s ease;
    pointer-events:none;
  }
  .card:hover{transform:translateY(-6px)}
  .card:hover::before{opacity:1}

  /* Card accent colors */
  .card--love::before{background:radial-gradient(ellipse at 30% 20%,rgba(192,132,252,0.08),transparent 70%)}
  .card--love:hover{box-shadow:0 8px 40px rgba(192,132,252,0.12),0 0 0 1px rgba(192,132,252,0.1)}
  .card--love .card-accent{background:linear-gradient(135deg,#c084fc,#f9a8d4)}

  .card--stock::before{background:radial-gradient(ellipse at 30% 20%,rgba(202,138,4,0.08),transparent 70%)}
  .card--stock:hover{box-shadow:0 8px 40px rgba(202,138,4,0.12),0 0 0 1px rgba(202,138,4,0.1)}
  .card--stock .card-accent{background:linear-gradient(135deg,#CA8A04,#FBBF24)}

  .card--migraine::before{background:radial-gradient(ellipse at 30% 20%,rgba(67,184,156,0.08),transparent 70%)}
  .card--migraine:hover{box-shadow:0 8px 40px rgba(67,184,156,0.12),0 0 0 1px rgba(67,184,156,0.1)}
  .card--migraine .card-accent{background:linear-gradient(135deg,#43b89c,#38a3d0)}

  .card--tv::before{background:radial-gradient(ellipse at 30% 20%,rgba(129,140,248,0.08),transparent 70%)}
  .card--tv:hover{box-shadow:0 8px 40px rgba(129,140,248,0.12),0 0 0 1px rgba(129,140,248,0.1)}
  .card--tv .card-accent{background:linear-gradient(135deg,#818cf8,#a78bfa)}

  .card--currency::before{background:radial-gradient(ellipse at 30% 20%,rgba(124,58,237,0.08),transparent 70%)}
  .card--currency:hover{box-shadow:0 8px 40px rgba(124,58,237,0.12),0 0 0 1px rgba(124,58,237,0.1)}

  /* Card icon */
  .card-icon{
    width:42px;height:42px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    flex-shrink:0;
  }
  .card-icon img,.card-icon svg{width:100%;height:100%;object-fit:cover;border-radius:11px}

  /* Card body */
  .card-body{flex:1;min-width:0}
  .card-title{font-size:15px;font-weight:650;letter-spacing:-.2px;margin-bottom:2px}
  .card-desc{font-size:12px;color:var(--text-muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

  /* Card arrow */
  .card-arrow{
    width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--arrow-bg);
    flex-shrink:0;
    transition:background .3s ease,transform .3s ease;
  }
  .card-arrow svg{width:12px;height:12px;stroke:var(--text-muted);stroke-width:2;fill:none;transition:stroke .3s ease}
  .card:hover .card-arrow{background:var(--arrow-bg-hover);transform:translateX(2px)}
  .card:hover .card-arrow svg{stroke:var(--text)}


  /* ── Animations ── */
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(24px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* ── PC Desktop ── */
  @media(min-width:768px){
    .orb-1{width:520px;height:520px;filter:blur(100px);animation:drift1 22s ease-in-out infinite alternate}
    .orb-2{width:480px;height:480px;filter:blur(100px);animation:drift2 26s ease-in-out infinite alternate}
    .orb-3{width:400px;height:400px;filter:blur(100px);animation:drift3 20s ease-in-out infinite alternate}
    @keyframes drift1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(60px,40px) scale(1.12)}}
    @keyframes drift2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-50px,-30px) scale(1.1)}}
    @keyframes drift3{0%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-40%,-55%) scale(1.15)}}
    .page{padding:48px 40px}
    .header{margin-bottom:40px}
    .header-icon{font-size:44px;margin-bottom:12px}
    .header p{font-size:15px;margin-top:10px}
    .sections{gap:40px;max-width:1060px}
    .section{gap:16px}
    .section-title{font-size:12px;padding:0 2px}
    .section-title::before{width:4px;height:14px}
    .cards{
      grid-template-columns:repeat(3,1fr);
      gap:24px;
    }
    .card{
      flex-direction:column;align-items:flex-start;gap:0;
      padding:32px 28px 28px;
    }
    .card-icon{width:56px;height:56px;border-radius:14px;margin-bottom:18px}
    .card-icon img,.card-icon svg{border-radius:14px}
    .card-body{margin-bottom:20px}
    .card-title{font-size:18px;margin-bottom:6px}
    .card-desc{font-size:14px;line-height:1.6;-webkit-line-clamp:3}
    .card-arrow{width:32px;height:32px;align-self:flex-end}
    .card-arrow svg{width:16px;height:16px}
  }

  /* ── Reduced motion ── */
  @media(prefers-reduced-motion:reduce){
    .orb,.card,.header,.footer{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="page">

  <div class="sections">

      <div class="section-title">生活 <span class="count">3</span></div>

        <a class="card card--love" href="love.html" target="_blank">

        <a class="card card--tv" href="http://47.103.108.226:8888/tv-tracker" target="_blank">

        <!-- 偏头痛记录 -->
        <a class="card card--migraine" href="migraine.html?v=3" target="_blank">

            <div class="card-title">偏头痛记录</div>

          </div>

      </div>
    </section>

    <!-- 投资 -->
    <section class="section section--invest">
      <div class="section-title">投资 <span class="count">3</span></div>
      <div class="cards">

        <!-- 止盈计算推演 -->
        <a class="card card--stock" href="./?v=3" target="_blank">
          <div class="card-icon">

          </div>
          <div class="card-body">
            <div class="card-title">止盈计算推演</div>
            <div class="card-desc">股票止盈策略模拟工具，支持多币种实时价格与分批止盈方案推演。</div>
          </div>
          <span class="card-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </a>

        <!-- 02680 创陞跟踪 -->
        <a class="card card--stock" href="02680.html" target="_blank">

            <svg viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="12" fill="#1a1a2e"/><path d="M12 32l8-10 6 6 10-14" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="14" r="3" fill="#CA8A04"/></svg>

        <a class="card card--currency" href="currency.html" target="_blank">
          <div class="card-icon">
            <svg viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="12" fill="#1a1028"/><text x="24" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#c084fc">¥</text><text x="14" y="38" text-anchor="middle" font-size="9" font-weight="600" fill="#818cf8">$</text><text x="34" y="38" text-anchor="middle" font-size="9" font-weight="600" fill="#818cf8">HK$</text><path d="M18 24h12" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round"/><path d="M22 22l-3 2 3 2" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M26 22l3 2-3 2" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </div>
          <div class="card-body">
            <div class="card-title">汇率计算</div>
            <div class="card-desc">人民币、港币、美元三向实时换算，支持自定义汇率。</div>
          </div>
          <span class="card-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>

      </div>
    </section>

  </div>

</div>

<script>
  document.querySelectorAll('.card[target="_blank"]').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      window.open(this.href, '_blank');
    });
  });
</script>

</body>
</html>
