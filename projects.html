<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Projects</title>
<meta property="og:title" content="My Projects">
<meta property="og:description" content="一些自己做的小工具合集">
<meta property="og:image" content="https://chenruoyi0202-ship-it.github.io/cry/projects-icon.png">
<meta property="og:url" content="https://chenruoyi0202-ship-it.github.io/cry/projects.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🛠️</text></svg>">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#07070a;
    --card:#0e0e14;
    --border:rgba(255,255,255,0.06);
    --text:#e8eaf0;
    --text-muted:#6b7394;
    --radius:24px;
  }
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'SF Pro Display','SF Pro Text',-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100dvh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ── Background ── */
  .bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.35;will-change:transform}
  .orb-1{width:520px;height:520px;background:radial-gradient(circle,#c084fc 0%,transparent 70%);top:-120px;left:-80px;animation:drift1 22s ease-in-out infinite alternate}
  .orb-2{width:480px;height:480px;background:radial-gradient(circle,#CA8A04 0%,transparent 70%);bottom:-100px;right:-60px;animation:drift2 26s ease-in-out infinite alternate}
  .orb-3{width:400px;height:400px;background:radial-gradient(circle,#43b89c 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:drift3 20s ease-in-out infinite alternate}
  @keyframes drift1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(60px,40px) scale(1.12)}}
  @keyframes drift2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-50px,-30px) scale(1.1)}}
  @keyframes drift3{0%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-40%,-55%) scale(1.15)}}

  /* Grid dots */
  .bg-layer::after{
    content:'';position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.03) 1px,transparent 1px);
    background-size:32px 32px;
  }

  /* ── Layout ── */
  .page{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:24px 16px}

  /* ── Header ── */
  .header{text-align:center;margin-bottom:20px;animation:fadeUp .8s ease-out both}
  .header-icon{font-size:32px;margin-bottom:8px;display:block}
  .header h1{
    font-size:clamp(22px,5vw,38px);font-weight:700;
    letter-spacing:-.5px;
    background:linear-gradient(135deg,#e8eaf0 0%,#a0a8c4 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .header p{
    margin-top:6px;font-size:13px;color:var(--text-muted);
    letter-spacing:.3px;line-height:1.5;
  }

  /* ── Cards Grid ── */
  .cards{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
    width:100%;max-width:400px;
  }

  /* ── Card ── */
  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    display:flex;flex-direction:row;align-items:center;gap:14px;
    transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease,border-color .35s ease;
    cursor:pointer;
    text-decoration:none;color:inherit;
    overflow:hidden;
    animation:fadeUp .8s ease-out both;
  }
  .card:nth-child(1){animation-delay:.15s}
  .card:nth-child(2){animation-delay:.3s}
  .card:nth-child(3){animation-delay:.45s}
  .card:nth-child(4){animation-delay:.6s}

  .card::before{
    content:'';position:absolute;inset:0;
    border-radius:var(--radius);
    opacity:0;transition:opacity .4s ease;
    pointer-events:none;
  }
  .card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,0.1)}
  .card:hover::before{opacity:1}

  /* Card accent colors */
  .card--love::before{background:radial-gradient(ellipse at 30% 20%,rgba(192,132,252,0.08),transparent 70%)}
  .card--love:hover{box-shadow:0 8px 40px rgba(192,132,252,0.12),0 0 0 1px rgba(192,132,252,0.1)}
  .card--love .card-accent{background:linear-gradient(135deg,#c084fc,#f9a8d4)}

  .card--stock::before{background:radial-gradient(ellipse at 30% 20%,rgba(202,138,4,0.08),transparent 70%)}
  .card--stock:hover{box-shadow:0 8px 40px rgba(202,138,4,0.12),0 0 0 1px rgba(202,138,4,0.1)}
  .card--stock .card-accent{background:linear-gradient(135deg,#CA8A04,#FBBF24)}

  .card--migraine::before{background:radial-gradient(ellipse at 30% 20%,rgba(67,184,156,0.08),transparent 70%)}
  .card--migraine:hover{box-shadow:0 8px 40px rgba(67,184,156,0.12),0 0 0 1px rgba(67,184,156,0.1)}
  .card--migraine .card-accent{background:linear-gradient(135deg,#43b89c,#38a3d0)}

  /* Card icon */
  .card-icon{
    width:48px;height:48px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    flex-shrink:0;
  }
  .card-icon img,.card-icon svg{width:100%;height:100%;object-fit:cover;border-radius:12px}

  /* Card body */
  .card-body{flex:1;min-width:0}
  .card-title{font-size:15px;font-weight:650;letter-spacing:-.2px;margin-bottom:3px}
  .card-desc{font-size:12px;color:var(--text-muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* Card arrow */
  .card-arrow{
    width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.04);
    flex-shrink:0;
    transition:background .3s ease,transform .3s ease;
  }
  .card-arrow svg{width:14px;height:14px;stroke:var(--text-muted);stroke-width:2;fill:none;transition:stroke .3s ease}
  .card:hover .card-arrow{background:rgba(255,255,255,0.08);transform:translateX(2px)}
  .card:hover .card-arrow svg{stroke:var(--text)}

  /* ── Animations ── */
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(24px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* ── PC Desktop ── */
  @media(min-width:768px){
    .page{padding:48px 40px}
    .header{margin-bottom:40px}
    .header-icon{font-size:44px;margin-bottom:12px}
    .header p{font-size:15px;margin-top:10px}
    .cards{
      grid-template-columns:repeat(4,1fr);
      gap:24px;
      max-width:1200px;
    }
    .card{
      flex-direction:column;align-items:flex-start;gap:0;
      padding:32px 28px 28px;
    }
    .card-icon{width:56px;height:56px;border-radius:14px;margin-bottom:18px}
    .card-icon img,.card-icon svg{border-radius:14px}
    .card-body{margin-bottom:20px}
    .card-title{font-size:18px;margin-bottom:6px}
    .card-desc{font-size:14px;line-height:1.6;-webkit-line-clamp:3}
    .card-arrow{width:32px;height:32px;align-self:flex-end}
    .card-arrow svg{width:16px;height:16px}
  }

  /* ── Reduced motion ── */
  @media(prefers-reduced-motion:reduce){
    .orb,.card,.header,.footer{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="page">

  <header class="header">
    <span class="header-icon">🛠️</span>
    <h1>My Projects</h1>
    <p>一些自己做的小工具合集</p>
  </header>

  <div class="cards">

    <!-- Our Memory -->
    <a class="card card--love" href="love.html" target="_blank">
      <div class="card-icon">

      <div class="card-body">

      </div>
      <span class="card-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>

    <!-- 止盈计算推演 -->
    <a class="card card--stock" href="./?v=3" target="_blank">

      <div class="card-body">

    <!-- 偏头痛记录 -->
    <a class="card card--migraine" href="migraine.html?v=3" target="_blank">

    <!-- 02680 创陞跟踪 -->
    <a class="card card--stock" href="02680.html" target="_blank">

      </div>
      <div class="card-body">
        <div class="card-title">02680 创陞跟踪</div>
        <div class="card-desc">港股02680创陞控股分析追踪，记录盘中分析、重要事件与实时行情。</div>
      </div>
      <span class="card-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

  </div>

</div>

</body>
</html>
