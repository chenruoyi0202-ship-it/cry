# /etc/nginx/sites-available/cry
#
# 部署：
#   cp deploy/nginx.conf /etc/nginx/sites-available/cry
#   sed -i 's/your.domain.com/<你的域名>/g' /etc/nginx/sites-available/cry
#   ln -sf /etc/nginx/sites-available/cry /etc/nginx/sites-enabled/cry
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# 拿 HTTPS 证书（有域名）：
#   certbot --nginx -d your.domain.com
# certbot 会自动在这个 server block 里加 listen 443 ssl 那几行。

server {
    listen 80;
    listen [::]:80;
    server_name your.domain.com;

    root /var/www/cry;
    index projects.html jobs.html index.html;

    # 数据文件实时性优先，禁缓存 + 开 CORS 方便前端 fetch
    location ~* \.(json|md)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    # HTML 适度缓存
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300";
    }

    # 静态资源长缓存
    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=86400, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 简单防扫描：屏蔽常见敏感路径
    location ~ /\.(git|env|ssh) { deny all; return 404; }
}
