<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="40" fill="#0a0a0f"/>
  <rect x="8" y="8" width="184" height="184" rx="34" fill="none" stroke="#CA8A04" stroke-width="2" opacity="0.3"/>
  <!-- Candlestick chart -->
  <!-- Green candle (down) -->
  <line x1="45" y1="70" x2="45" y2="140" stroke="#22c55e" stroke-width="3"/>
  <rect x="36" y="85" width="18" height="40" rx="2" fill="#22c55e"/>
  <!-- Red candle (up) -->
  <line x1="80" y1="55" x2="80" y2="130" stroke="#ef4444" stroke-width="3"/>
  <rect x="71" y="65" width="18" height="45" rx="2" fill="#ef4444"/>
  <!-- Red candle (up, tall) -->
  <line x1="115" y1="35" x2="115" y2="110" stroke="#ef4444" stroke-width="3"/>
  <rect x="106" y="45" width="18" height="50" rx="2" fill="#ef4444"/>
  <!-- Green candle (down, small) -->
  <line x1="150" y1="50" x2="150" y2="105" stroke="#22c55e" stroke-width="3"/>
  <rect x="141" y="60" width="18" height="30" rx="2" fill="#22c55e"/>
  <!-- Stock code -->
  <text x="100" y="172" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FBBF24">02680</text>
</svg>
