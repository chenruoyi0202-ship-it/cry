name: CCASS 02680 Daily

on:
  schedule:
    # 每个工作日 HKT 17:30 (UTC 09:30) — CCASS 通常 17:00 后刷新
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
    inputs:
      shareholding_date:
        description: '持股日期 (YYYY/MM/DD)，留空取最近交易日'
        required: false
        default: ''
      stock_code:
        description: '股票代码'
        required: false
        default: '02680'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Scrape CCASS
        run: |
          python scraper/scrape_ccass.py \
            "${{ github.event.inputs.shareholding_date }}" \
            "${{ github.event.inputs.stock_code || '02680' }}"

      - name: Generate analysis report
        run: |
          python scraper/analyze_ccass.py "${{ github.event.inputs.stock_code || '02680' }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock_*_ccass*.json data/stock_*_ccass_report.md data/ccass_history/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No CCASS changes to commit"
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "chore(ccass): update 02680 CCASS data ($DATE)"
            for i in 1 2 3 4; do
              git push && break || sleep $((2 ** i))
            done
          fi
