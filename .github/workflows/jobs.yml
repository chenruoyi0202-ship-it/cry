name: 深圳招聘 Daily Scrape

on:
  schedule:
    # 每日 09:00 北京时间 (UTC 01:00)
    - cron: '0 1 * * *'
  push:
    branches: [main]
    paths:
      - 'scraper/scrape_jobs.py'
      - 'scraper/jobs_sources/**'
      - '.github/workflows/jobs.yml'
  workflow_dispatch:
    inputs:
      company:
        description: '只跑某家公司 (tencent/bytedance/meituan/all)'
        required: false
        default: 'all'

permissions:
  contents: write

concurrency:
  group: jobs-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Scrape jobs
        id: scrape
        run: |
          python scraper/scrape_jobs.py --company "${{ github.event.inputs.company || 'all' }}"

      - name: Commit and push
        if: steps.scrape.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "No jobs.json changes to commit"
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "chore(jobs): refresh 深圳大厂招聘 ($DATE)"
            for i in 1 2 3 4; do
              git push && break || sleep $((2 ** i))
            done
          fi
