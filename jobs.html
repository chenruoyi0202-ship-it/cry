<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>深圳大厂招聘 · 腾讯 · 字节 · 美团</title>
<meta name="description" content="深圳大厂在招职位聚合 — 腾讯、字节跳动、美团，每日自动更新。">
<meta property="og:title" content="深圳大厂招聘">
<meta property="og:description" content="深圳腾讯、字节跳动、美团社招职位聚合，每日刷新">
<meta property="og:url" content="https://chenruoyi0202-ship-it.github.io/cry/jobs.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🏢</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="深圳招聘">
<script>
  (function(){
    var saved = localStorage.getItem('jobs.theme');
    if (saved === 'light') document.documentElement.setAttribute('data-theme','light');
    else if (saved === 'dark') document.documentElement.removeAttribute('data-theme');
    else if (window.matchMedia('(prefers-color-scheme: light)').matches)
      document.documentElement.setAttribute('data-theme','light');
  })();
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070710;--card:#0e0e16;--card-hover:#13131e;
  --border:rgba(255,255,255,0.07);--border-strong:rgba(255,255,255,0.14);
  --text:#e8eaf0;--text-muted:#8892b0;--text-dim:#5a6280;
  --accent:#38bdf8;--accent2:#0ea5e9;--accent-glow:rgba(56,189,248,0.18);
  --tencent:#1ec0e5;--bytedance:#a78bfa;--meituan:#facc15;
  --pill-bg:rgba(255,255,255,0.04);--pill-bg-active:rgba(56,189,248,0.18);
  --warn:#f59e0b;--warn-bg:rgba(245,158,11,0.10);
  --error:#ef4444;
  --radius:14px;
}
[data-theme="light"]{
  --bg:#f5f7fb;--card:#ffffff;--card-hover:#f0f4f9;
  --border:rgba(15,23,42,0.08);--border-strong:rgba(15,23,42,0.16);
  --text:#0f172a;--text-muted:#64748b;--text-dim:#94a3b8;
  --accent:#0284c7;--accent2:#0369a1;--accent-glow:rgba(2,132,199,0.14);
  --pill-bg:rgba(15,23,42,0.04);--pill-bg-active:rgba(2,132,199,0.14);
  --warn:#b45309;--warn-bg:rgba(245,158,11,0.14);
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Figtree','Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  transition:background .3s ease,color .3s ease;
}

.page{max-width:920px;margin:0 auto;padding:18px 14px 80px;position:relative}

/* Header buttons */
.header-actions{position:absolute;top:16px;right:14px;display:flex;gap:6px}
.icon-btn{
  width:32px;height:32px;border-radius:8px;
  background:var(--pill-bg);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .2s,color .2s;color:var(--text-muted);
}
.icon-btn:hover{background:var(--card-hover);color:var(--text)}
.icon-btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.icon-btn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Header */
.header{padding:8px 4px 14px}
.header-icon{font-size:30px;display:block;margin-bottom:4px}
.header h1{
  font-size:24px;font-weight:700;letter-spacing:-.4px;
  background:linear-gradient(135deg,var(--text) 0%,var(--accent) 120%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.header .subtitle{margin-top:4px;font-size:13px;color:var(--text-muted);line-height:1.5}
.header .meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--text-muted)}
.header .meta .dot{color:var(--text-dim)}
.header .meta strong{color:var(--text);font-weight:600}

/* Stale banner */
.banner{
  margin:12px 0;padding:10px 12px;border-radius:10px;
  background:var(--warn-bg);color:var(--warn);
  font-size:12px;line-height:1.5;
  border:1px solid rgba(245,158,11,0.25);
  display:none;
}
.banner.show{display:block}

/* Filters */
.filters{
  margin:14px 0 10px;padding:10px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  display:flex;flex-direction:column;gap:10px;
}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-input{
  width:100%;padding:9px 12px 9px 32px;border-radius:10px;
  background:var(--pill-bg);border:1px solid var(--border);
  color:var(--text);font-size:16px;font-family:inherit;
  transition:border-color .2s,background .2s;
}
.search-input:focus{outline:none;border-color:var(--accent);background:var(--card-hover)}
.search-input::placeholder{color:var(--text-dim)}
.search-icon{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:var(--text-dim);stroke:currentColor;fill:none;stroke-width:2;
}
.cat-select{
  padding:9px 30px 9px 12px;border-radius:10px;
  background:var(--pill-bg);border:1px solid var(--border);color:var(--text);
  font-size:16px;font-family:inherit;cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.clear-btn{
  padding:7px 12px;border-radius:10px;
  background:transparent;border:1px solid var(--border);color:var(--text-muted);
  font-size:12px;cursor:pointer;font-family:inherit;
  transition:border-color .2s,color .2s;
}
.clear-btn:hover{border-color:var(--accent);color:var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:999px;
  background:var(--pill-bg);border:1px solid var(--border);
  font-size:12px;color:var(--text-muted);
  cursor:pointer;user-select:none;
  transition:all .2s;
  font-family:inherit;
}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip.active{background:var(--pill-bg-active);border-color:var(--accent);color:var(--accent)}
.chip .chip-count{
  font-size:10px;padding:1px 5px;border-radius:8px;
  background:rgba(255,255,255,0.06);color:var(--text-dim);
  font-variant-numeric:tabular-nums;
}
[data-theme="light"] .chip .chip-count{background:rgba(15,23,42,0.05)}
.chip.active .chip-count{background:rgba(56,189,248,0.22);color:var(--accent)}
.chip.stale::after{content:'·陈旧';margin-left:2px;color:var(--warn);font-size:10px}

/* Result summary */
.result-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 4px;font-size:12px;color:var(--text-muted);
  margin:6px 0 10px;
}

/* Job list */
.jobs{display:flex;flex-direction:column;gap:8px}
.job{
  display:flex;flex-direction:column;gap:6px;
  padding:12px 14px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  text-decoration:none;color:inherit;
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
}
.job:hover{transform:translateY(-1px);border-color:var(--accent);background:var(--card-hover)}
.job-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.job-pill{
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;
  flex-shrink:0;font-variant-numeric:tabular-nums;
}
.job-pill.tencent{background:rgba(30,192,229,0.15);color:var(--tencent)}
.job-pill.bytedance{background:rgba(167,139,250,0.18);color:var(--bytedance)}
.job-pill.meituan{background:rgba(250,204,21,0.18);color:var(--meituan)}
.job-title{font-size:15px;font-weight:600;color:var(--text);line-height:1.35;flex:1;min-width:0;word-break:break-word}
.job-arrow{color:var(--text-dim);font-size:13px;line-height:1;align-self:center}
.job:hover .job-arrow{color:var(--accent)}
.job-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text-muted)}
.job-meta span{display:inline-flex;align-items:center;gap:3px}
.job-meta .meta-dept{color:var(--text)}

/* Match score pill on each job */
.score-pill{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;
  flex-shrink:0;font-variant-numeric:tabular-nums;
  background:rgba(56,189,248,0.10);color:var(--accent);
  border:1px solid rgba(56,189,248,0.18);
}
.score-pill.s-high{background:rgba(34,197,94,0.14);color:#22c55e;border-color:rgba(34,197,94,0.22)}
.score-pill.s-mid{background:rgba(56,189,248,0.12);color:var(--accent);border-color:rgba(56,189,248,0.20)}
.score-pill.s-low{background:rgba(148,163,184,0.10);color:var(--text-muted);border-color:rgba(148,163,184,0.18)}

/* Resume modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);
  z-index:200;display:none;align-items:flex-end;justify-content:center;
  padding:0;
}
[data-theme="light"] .modal-overlay{background:rgba(15,23,42,0.45)}
.modal-overlay.show{display:flex}
.modal{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px 16px 0 0;
  width:100%;max-width:540px;max-height:88dvh;
  display:flex;flex-direction:column;
  animation:slideUp .25s cubic-bezier(.22,1,.36,1);
}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--border);
}
.modal-title{font-size:15px;font-weight:600;color:var(--text)}
.modal-close{
  width:30px;height:30px;border-radius:8px;
  background:var(--pill-bg);border:1px solid var(--border);color:var(--text-muted);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;
}
.modal-close:hover{color:var(--text)}
.modal-body{
  padding:14px 16px;overflow-y:auto;flex:1;
  display:flex;flex-direction:column;gap:10px;
}
.modal-body .privacy{
  font-size:11px;color:var(--text-muted);
  background:var(--pill-bg);border:1px solid var(--border);
  padding:8px 10px;border-radius:8px;line-height:1.5;
}
.modal-body .privacy strong{color:var(--text)}
/* Job detail modal */
.job-detail-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:6px}
.job-detail-title{font-size:17px;font-weight:700;color:var(--text);line-height:1.35;flex:1;min-width:0;word-break:break-word}
.job-detail-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text-muted);margin:4px 0 12px}
.job-detail-meta span{display:inline-flex;align-items:center;gap:3px}
.job-detail-meta .meta-dept{color:var(--text)}
.job-detail-section{font-size:13px;color:var(--text);line-height:1.65;white-space:pre-wrap;word-break:break-word}
.job-detail-section + .job-detail-section{margin-top:14px}
.job-detail-section h4{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.job-detail-empty{color:var(--text-muted);font-size:13px;padding:8px 0}

.resume-input{
  width:100%;min-height:240px;
  padding:10px 12px;border-radius:10px;
  background:var(--pill-bg);border:1px solid var(--border);
  color:var(--text);font-size:14px;font-family:inherit;line-height:1.5;
  resize:vertical;
}
.resume-input:focus{outline:none;border-color:var(--accent);background:var(--card-hover)}
.resume-stats{font-size:11px;color:var(--text-muted)}
.resume-stats strong{color:var(--accent);font-variant-numeric:tabular-nums}
.modal-foot{
  display:flex;gap:8px;padding:12px 16px;
  border-top:1px solid var(--border);
}
.btn{
  flex:1;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;
  font-family:inherit;cursor:pointer;border:1px solid var(--border);
  background:var(--pill-bg);color:var(--text);
  transition:background .2s,border-color .2s;
}
.btn:hover{background:var(--card-hover)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-ghost{background:transparent;color:var(--text-muted)}

/* Resume status row in filter bar */
.resume-row{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:12px;color:var(--text-muted);
}
.resume-row .resume-cta{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 11px;border-radius:8px;
  background:var(--pill-bg);border:1px solid var(--border);
  cursor:pointer;font-family:inherit;color:var(--text-muted);font-size:12px;
}
.resume-row .resume-cta:hover{color:var(--accent);border-color:var(--accent)}
.resume-row .resume-cta.active{background:var(--pill-bg-active);border-color:var(--accent);color:var(--accent)}
.resume-row .sort-toggle{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;
}
.resume-row .sort-toggle select{
  padding:5px 24px 5px 8px;border-radius:8px;
  background:var(--pill-bg);border:1px solid var(--border);color:var(--text);
  font-size:12px;font-family:inherit;cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);
  background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}

.empty{
  text-align:center;padding:40px 20px;color:var(--text-muted);
  background:var(--card);border:1px solid var(--border);border-radius:12px;
}
.empty-emoji{font-size:32px;display:block;margin-bottom:8px;opacity:.6}

.footer{
  margin-top:32px;padding:0 4px;font-size:11px;color:var(--text-dim);
  text-align:center;line-height:1.6;
}
.footer a{color:var(--text-muted);text-decoration:none}
.footer a:hover{color:var(--accent)}

@media(min-width:640px){
  .page{padding:24px 18px 80px}
  .header h1{font-size:30px}
  .header .subtitle{font-size:14px}
  .filters{padding:14px;gap:12px}
}
@media(min-width:900px){
  .page{padding:32px 24px 80px}
  .header-icon{font-size:36px}
  .header h1{font-size:34px}
  .jobs{gap:10px}
  .job{padding:14px 16px}
  .job-title{font-size:16px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div class="page">
  <div class="header-actions">
    <button class="icon-btn" id="refreshBtn" title="刷新数据" aria-label="刷新数据">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3.5-7.1M21 4v5h-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>

  <header class="header">
    <span class="header-icon">🏢</span>
    <h1>深圳大厂招聘</h1>
    <p class="subtitle">腾讯 · 字节跳动 — 公开 API 聚合，每日自动刷新</p>
    <div class="meta" id="meta">
      <span id="metaUpdated">加载中…</span>
      <span class="dot">·</span>
      <span>共 <strong id="metaCount">0</strong> 个职位</span>
    </div>
  </header>

  <div class="banner" id="staleBanner"></div>

  <div class="filters">
    <div class="filter-row">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="search-input" id="searchInput" type="search" placeholder="搜索职位 / 部门，例如 后端 / 微信" autocomplete="off">
      </div>
      <select class="cat-select" id="catSelect"><option value="">全部类别</option></select>
      <button class="clear-btn" id="clearBtn">清除</button>
    </div>
    <div class="filter-row">
      <div class="chips" id="companyChips"></div>
    </div>
    <div class="resume-row">
      <button class="resume-cta" id="resumeBtn" type="button">
        <span id="resumeBtnLabel">📄 默认简历 · 编辑</span>
      </button>
      <span id="resumeStatus"></span>
    </div>
    <div class="resume-row">
      <span class="sort-toggle">
        时间
        <select id="dateFilter">
          <option value="0">全部</option>
          <option value="7">近 7 天</option>
          <option value="30">近 30 天</option>
          <option value="90">近 90 天</option>
        </select>
      </span>
      <span class="sort-toggle">
        匹配度
        <select id="matchFilter">
          <option value="0">全部</option>
          <option value="0.05">≥ 5%</option>
          <option value="0.10">≥ 10%</option>
          <option value="0.20">≥ 20%</option>
          <option value="0.30">≥ 30%</option>
        </select>
      </span>
      <span class="sort-toggle" id="sortToggle">
        排序
        <select id="sortSelect">
          <option value="match">按匹配度</option>
          <option value="date">按发布日期</option>
        </select>
      </span>
    </div>
  </div>

  <div class="modal-overlay" id="jobModal" role="dialog" aria-modal="true" aria-labelledby="jobModalTitle">
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title" id="jobModalTitle">职位详情</span>
        <button class="modal-close" id="jobModalClose" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="jobModalBody"></div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="jobModalCloseBtn" type="button">关闭</button>
        <a class="btn btn-primary" id="jobModalGo" target="_blank" rel="noopener">查看原网页 →</a>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="resumeModal" role="dialog" aria-modal="true" aria-labelledby="resumeModalTitle">
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title" id="resumeModalTitle">匹配我的简历</span>
        <button class="modal-close" id="resumeModalClose" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="privacy">
          🔒 <strong>简历仅在你浏览器本地处理</strong>，存在 localStorage，
          不会上传到 GitHub 或任何服务器。我只用关键词在职位标题、部门、职责描述里做计分。
        </div>
        <textarea class="resume-input" id="resumeInput" placeholder="把简历正文粘贴到这里 — 工作经历、项目、技能都可以。越详细，匹配越准。" autocomplete="off" spellcheck="false"></textarea>
        <div class="resume-stats" id="resumeStats">输入简历后会显示识别到的关键词数量</div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="resumeClear" type="button">清除</button>
        <button class="btn btn-primary" id="resumeSave" type="button">保存并匹配</button>
      </div>
    </div>
  </div>

  <div class="result-bar">
    <span id="resultSummary">显示 0 / 0 个职位</span>
    <span id="lastSync"></span>
  </div>

  <div class="jobs" id="jobsList"></div>
  <div class="empty" id="emptyState" style="display:none">
    <span class="empty-emoji">🔍</span>
    <div>没有匹配的职位</div>
    <div style="margin-top:6px;font-size:12px">尝试调整搜索词或筛选条件</div>
  </div>

  <div class="footer">
    数据来源 ·
    <a href="https://careers.tencent.com" target="_blank" rel="noopener">careers.tencent.com</a> ·
    <a href="https://jobs.bytedance.com" target="_blank" rel="noopener">jobs.bytedance.com</a><br>
    <span style="opacity:.7">每日 09:00 北京时间自动同步 · 仅供个人参考</span>
  </div>
</div>

<script>
const DATA_URL = 'data/jobs.json';
const COMPANY_ORDER = ['tencent', 'bytedance', 'meituan'];
const COMPANY_DEFAULTS = {
  tencent:   { name: '腾讯' },
  bytedance: { name: '字节跳动' },
  meituan:   { name: '美团' },
};

const state = {
  data: null,
  filters: {
    q: '',
    companies: new Set(),  // empty = all
    category: '',
    sinceDays: 0,          // 0 = all time; 7/30/90 = filter recent
    minScore: 0,           // 0..1, hide jobs below this match score
  },
  resume: localStorage.getItem('jobs.resume') || '',
  resumeTokens: null,   // Set<string>
  idf: null,            // Map<token, weight>
  scores: null,         // Map<jobId, 0..1>
  totalResumeWeight: 0,
  sortMode: localStorage.getItem('jobs.sortMode') || 'match', // 'match' | 'date'
  isDefaultResume: false,
};

// Built-in resume keywords (no PII) so the page works out of the box.
// User can override by typing in the modal; localStorage takes precedence.
const DEFAULT_RESUME = `
产品运营 内容运营 用户运营 活动运营 社区运营 产品经理 运营经理 高级产品经理 内容生态
知识平台 知识社区 内容社区 互动社区 创作者社区
AI 社区 AI Coding Claude Code 大模型 LLM AGI 提效 工具
IP 打造 矩阵化 OGC PGC UGC 内容生产 内容分发 精准推荐 个性化推荐
创作者运营 KOL 圈子运营 圈层运营 用户分层
活动策划 大事件 H5 年度运营日历 落地页
KANO 模型 数据分析 数据后台 自动化工具 产品框架 功能规划 分类体系
冷启动 流量增长 用户增长 留存 提效 数据驱动
开发者大会 行业大会 TGDC Workshop 1V1 深度交流 圈层
游戏运营 游戏社区 游戏开发 游戏 IP 游戏知识
腾讯 阿里 阿里云 互联网 大厂 P7
内容矩阵 内容策略 增长策略 用户洞察
B 端 C 端 SaaS 平台运营
`.trim();

const $ = (id) => document.getElementById(id);

// ── Resume match: tokenization + IDF + scoring ────────────────────────
const STOPWORDS_EN = new Set(('the a an of to for and or in on at by with from is are was were be been being '
  + 'this that these those i me my we us our you your he she it they them their as if than then so but '
  + 'also have has had do does did can will would should could not no yes about into out up down off '
  + 'over under more most less few some any all every each other one two').split(' ').filter(Boolean));
const STOPWORDS_CN_BG = new Set([
  '的的','了了','是是','和和','与与','或或','及及','在的','的在','了的','的了',
  '我们','你们','他们','以及','以下','以上','其中','其他','此外','由于','因此',
  '所以','但是','然而','不过','例如','比如','以及','可以','需要','要求','负责',
  '工作','岗位','职位','职责','内容','相关','以及','并且','或者','一个','一种',
  '一些','一般','一定','部分','全部','大部','部分','以及','并且','以下','为以',
]);
// Common Chinese fillers that pollute matches if treated as bigrams.
const STOPWORD_CHARS = new Set('的了是我你他她它们和与或及在上下了过为而但呢吗啊吧的'.split(''));

function _isCJK(ch) {
  const c = ch.charCodeAt(0);
  return (c >= 0x4e00 && c <= 0x9fff);
}

function tokenize(text) {
  if (!text) return new Set();
  const lowered = text.toLowerCase();
  const tokens = new Set();
  // English-ish words: 2+ chars, allow .+#-_
  const enRegex = /[a-z][a-z0-9+#.\-_]{1,40}/g;
  let m;
  while ((m = enRegex.exec(lowered)) !== null) {
    const t = m[0];
    if (t.length >= 2 && !STOPWORDS_EN.has(t)) tokens.add(t);
  }
  // Chinese: take 2-char bigrams from each CJK run, skipping bigrams that are
  // mostly filler characters.
  const cjkRegex = /[一-鿿]+/g;
  while ((m = cjkRegex.exec(text)) !== null) {
    const seg = m[0];
    for (let i = 0; i < seg.length - 1; i++) {
      const bg = seg.substr(i, 2);
      if (STOPWORDS_CN_BG.has(bg)) continue;
      // Skip bigrams where both chars are filler.
      if (STOPWORD_CHARS.has(bg[0]) && STOPWORD_CHARS.has(bg[1])) continue;
      tokens.add(bg);
    }
  }
  // Plain numbers (years etc.) we don't want in match.
  for (const t of [...tokens]) {
    if (/^\d+$/.test(t)) tokens.delete(t);
  }
  return tokens;
}

function buildJobHaystack(job) {
  return `${job.title || ''}\n${job.department || ''}\n${job.category_raw || ''}\n${job.description || ''}`;
}

function buildIdf(jobs) {
  const N = jobs.length || 1;
  const df = new Map();
  for (const j of jobs) {
    const tokens = tokenize(buildJobHaystack(j));
    j._tokens = tokens;     // cache
    j._haystack = buildJobHaystack(j).toLowerCase();
    for (const t of tokens) df.set(t, (df.get(t) || 0) + 1);
  }
  const idf = new Map();
  for (const [t, c] of df) idf.set(t, Math.log((N + 1) / (c + 1)) + 1);
  return idf;
}

function scoreAllJobs() {
  if (!state.idf || !state.resumeTokens || !state.data) {
    state.scores = null;
    return;
  }
  const idf = state.idf;
  const rt = state.resumeTokens;
  let totalW = 0;
  for (const t of rt) totalW += (idf.get(t) || 0.5);
  state.totalResumeWeight = totalW || 1;
  const scores = new Map();
  for (const j of state.data.jobs || []) {
    let matched = 0;
    for (const t of rt) {
      if (j._haystack && j._haystack.indexOf(t) !== -1) {
        matched += (idf.get(t) || 0.5);
      }
    }
    scores.set(j.id, matched / state.totalResumeWeight);
  }
  state.scores = scores;
}

function applyResume(text, persist) {
  const userText = (text || '').trim();
  if (persist) {
    if (userText) localStorage.setItem('jobs.resume', userText);
    else localStorage.removeItem('jobs.resume');
  }
  // If user cleared, fall back to the built-in default keywords so the
  // page is still useful without any input.
  state.resume = userText || DEFAULT_RESUME;
  state.isDefaultResume = !userText;
  state.resumeTokens = tokenize(state.resume);
  scoreAllJobs();
  renderResumeRow();
  renderFilterControls();
  renderJobs();
}

function renderResumeRow() {
  const label = $('resumeBtnLabel');
  const btn = $('resumeBtn');
  const status = $('resumeStatus');
  const n = state.resumeTokens ? state.resumeTokens.size : 0;
  if (state.isDefaultResume) {
    label.textContent = '📄 默认简历 · 编辑';
    btn.classList.add('active');
    status.style.display = '';
    status.textContent = `内置 ${n} 关键词，点按钮可替换为你的`;
  } else {
    label.textContent = '📄 我的简历 · 编辑';
    btn.classList.add('active');
    status.style.display = '';
    status.textContent = `已识别 ${n} 个关键词`;
  }
  $('sortSelect') && ($('sortSelect').value = state.sortMode);
}

// ── Modal control ─────────────────────────────────────────────────────
function openResumeModal() {
  // Show whatever is currently active (user-provided or the built-in default)
  // so editing always starts from a real baseline.
  $('resumeInput').value = state.resume;
  updateModalStats();
  $('resumeModal').classList.add('show');
  setTimeout(() => $('resumeInput').focus(), 50);
}
function closeResumeModal() { $('resumeModal').classList.remove('show'); }
function updateModalStats() {
  const text = $('resumeInput').value;
  const tokens = tokenize(text);
  $('resumeStats').textContent = text
    ? `已识别 ${tokens.size} 个关键词`
    : '输入简历后会显示识别到的关键词数量';
}
$('resumeBtn').addEventListener('click', openResumeModal);
$('resumeModalClose').addEventListener('click', closeResumeModal);
$('resumeModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeResumeModal(); });
$('resumeInput').addEventListener('input', updateModalStats);
$('resumeSave').addEventListener('click', () => {
  applyResume($('resumeInput').value.trim(), true);
  closeResumeModal();
});
$('resumeClear').addEventListener('click', () => {
  $('resumeInput').value = '';
  updateModalStats();
  applyResume('', true);
  closeResumeModal();
});
$('sortSelect').addEventListener('change', (e) => {
  state.sortMode = e.target.value;
  localStorage.setItem('jobs.sortMode', state.sortMode);
  renderJobs();
});

// ── Job detail modal ──────────────────────────────────────────────────
function openJobModal(jobId) {
  const job = (state.data.jobs || []).find(j => j.id === jobId);
  if (!job) return;
  $('jobModalTitle').textContent = job.company_name || job.company;
  $('jobModalGo').href = job.url;
  const score = (state.scores && state.resumeTokens && state.resumeTokens.size)
    ? state.scores.get(job.id) : null;
  const scorePill = (score != null)
    ? `<span class="score-pill ${score>=0.20?'s-high':score>=0.10?'s-mid':'s-low'}">${Math.round(score*100)}% 匹配</span>`
    : '';
  const desc = (job.description || '').trim();
  const body = `
    <div class="job-detail-head">
      ${scorePill}
      <span class="job-pill ${escapeHtml(job.company)}">${escapeHtml(job.company_name || job.company)}</span>
      <span class="job-detail-title">${escapeHtml(job.title)}</span>
    </div>
    <div class="job-detail-meta">
      ${job.department ? `<span class="meta-dept">${escapeHtml(job.department)}</span>` : ''}
      ${job.category && job.category !== '其他' ? `<span>${escapeHtml(job.category)}</span>` : ''}
      ${job.location ? `<span>📍 ${escapeHtml(job.location)}</span>` : ''}
      ${job.posted_date ? `<span>🗓 ${escapeHtml(job.posted_date)}</span>` : ''}
    </div>
    <div class="job-detail-section">
      <h4>职位描述</h4>
      ${desc ? escapeHtml(desc) : '<div class="job-detail-empty">暂无描述（点击右下角查看原网页）</div>'}
    </div>
  `;
  $('jobModalBody').innerHTML = body;
  $('jobModalBody').scrollTop = 0;
  $('jobModal').classList.add('show');
}
function closeJobModal() { $('jobModal').classList.remove('show'); }
$('jobModalClose').addEventListener('click', closeJobModal);
$('jobModalCloseBtn').addEventListener('click', closeJobModal);
$('jobModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeJobModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if ($('jobModal').classList.contains('show')) closeJobModal();
  else if ($('resumeModal').classList.contains('show')) closeResumeModal();
});

$('dateFilter').addEventListener('change', (e) => {
  state.filters.sinceDays = parseInt(e.target.value, 10) || 0;
  renderJobs();
});
$('matchFilter').addEventListener('change', (e) => {
  state.filters.minScore = parseFloat(e.target.value) || 0;
  renderJobs();
});

// Hide the match-score filter + sort dropdown when no resume is active so
// the controls don't lie about what they do.
function renderFilterControls() {
  const hasResume = !!(state.resumeTokens && state.resumeTokens.size);
  $('matchFilter').parentElement.style.display = hasResume ? '' : 'none';
  $('sortToggle').style.display = hasResume ? '' : 'none';
}

// ── Theme ─────────────────────────────────────────────────────────────
$('themeBtn').addEventListener('click', () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('jobs.theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('jobs.theme', 'light');
  }
});

// ── URL state ─────────────────────────────────────────────────────────
function loadFromUrl() {
  const params = new URLSearchParams(location.search);
  state.filters.q = params.get('q') || '';
  state.filters.category = params.get('category') || '';
  const cs = (params.get('company') || '').split(',').filter(Boolean);
  state.filters.companies = new Set(cs);
}
function saveToUrl() {
  const params = new URLSearchParams();
  if (state.filters.q) params.set('q', state.filters.q);
  if (state.filters.category) params.set('category', state.filters.category);
  if (state.filters.companies.size) params.set('company', [...state.filters.companies].join(','));
  const qs = params.toString();
  history.replaceState(null, '', qs ? `?${qs}` : location.pathname);
}

// ── Format helpers ────────────────────────────────────────────────────
function fmtRelative(ts) {
  if (!ts) return '尚未同步';
  const diff = Date.now() - ts;
  if (diff < 60_000) return '刚刚';
  if (diff < 3600_000) return Math.floor(diff / 60_000) + ' 分钟前';
  if (diff < 86400_000) return Math.floor(diff / 3600_000) + ' 小时前';
  const days = Math.floor(diff / 86400_000);
  return days + ' 天前';
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

// ── Render ────────────────────────────────────────────────────────────
function renderHeader() {
  const data = state.data;
  const total = (data.jobs || []).length;
  $('metaCount').textContent = total;
  if (data.last_updated) {
    $('metaUpdated').textContent = '更新于 ' + fmtRelative(data.last_updated);
  } else {
    $('metaUpdated').textContent = data.last_updated_iso || '尚未首次同步';
  }
  $('lastSync').textContent = data.last_updated_iso && data.last_updated
    ? data.last_updated_iso.replace('T', ' ').slice(0, 16) : '';
}

function renderStaleBanner() {
  const cs = state.data.companies || {};
  const issues = [];
  for (const slug of COMPANY_ORDER) {
    const c = cs[slug];
    if (!c) continue;
    if (c.status !== 'stale' && c.status !== 'error') continue;
    // Only flag sources that were once working but are now stale — never
    // surface a banner for sources that have never delivered data.
    if (!c.fetched_at) continue;
    const name = c.name || COMPANY_DEFAULTS[slug].name;
    issues.push(`${name} 数据陈旧（上次成功 ${fmtRelative(c.fetched_at)}）`);
  }
  const banner = $('staleBanner');
  if (issues.length) {
    banner.textContent = '⚠ ' + issues.join(' · ');
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

function renderChips() {
  const wrap = $('companyChips');
  const counts = {};
  for (const job of (state.data.jobs || [])) counts[job.company] = (counts[job.company] || 0) + 1;
  const cs = state.data.companies || {};
  const html = COMPANY_ORDER.map(slug => {
    const c = cs[slug] || {};
    const n = counts[slug] || 0;
    // Skip the chip entirely when a source has no jobs and has never been
    // successful — this hides Meituan while its endpoint remains broken.
    if (n === 0 && !c.fetched_at) return '';
    const name = c.name || COMPANY_DEFAULTS[slug].name;
    const active = state.filters.companies.has(slug);
    const stale = (c.status === 'stale' || c.status === 'error') && c.fetched_at;
    return `<button class="chip ${active ? 'active' : ''} ${stale ? 'stale' : ''}" data-slug="${slug}">
      ${escapeHtml(name)}<span class="chip-count">${n}</span>
    </button>`;
  }).filter(Boolean).join('');
  wrap.innerHTML = html;
  wrap.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      const slug = el.dataset.slug;
      if (state.filters.companies.has(slug)) state.filters.companies.delete(slug);
      else state.filters.companies.add(slug);
      saveToUrl();
      renderChips();
      renderJobs();
    });
  });
}

function renderCategoryOptions() {
  const select = $('catSelect');
  const cats = state.data.categories || [];
  select.innerHTML = '<option value="">全部类别</option>' +
    cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  select.value = state.filters.category;
}

function filteredJobs() {
  const { q, companies, category, sinceDays, minScore } = state.filters;
  const qLower = q.trim().toLowerCase();
  const cutoff = sinceDays > 0
    ? new Date(Date.now() - sinceDays * 86400_000)
    : null;
  return (state.data.jobs || []).filter(j => {
    if (companies.size && !companies.has(j.company)) return false;
    if (category && j.category !== category) return false;
    if (qLower) {
      const hay = `${j.title} ${j.department} ${j.category_raw} ${j.location}`.toLowerCase();
      if (!hay.includes(qLower)) return false;
    }
    if (cutoff) {
      if (!j.posted_date) return false;
      const d = new Date(j.posted_date);
      if (isNaN(d.getTime()) || d < cutoff) return false;
    }
    if (minScore > 0) {
      const s = state.scores ? (state.scores.get(j.id) || 0) : 0;
      if (s < minScore) return false;
    }
    return true;
  });
}

function renderJobs() {
  const list = $('jobsList');
  const empty = $('emptyState');
  let jobs = filteredJobs();

  const scoring = !!(state.resume && state.scores);
  if (scoring && state.sortMode === 'match') {
    jobs = jobs.slice().sort((a, b) =>
      (state.scores.get(b.id) || 0) - (state.scores.get(a.id) || 0));
  }

  $('resultSummary').textContent = `显示 ${jobs.length} / ${(state.data.jobs || []).length} 个职位`;
  if (!jobs.length) {
    list.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = jobs.map(j => {
    let scoreHtml = '';
    if (scoring) {
      const s = state.scores.get(j.id) || 0;
      const pct = Math.round(s * 100);
      const cls = pct >= 20 ? 's-high' : pct >= 10 ? 's-mid' : 's-low';
      scoreHtml = `<span class="score-pill ${cls}" title="基于简历关键词命中">${pct}%</span>`;
    }
    return `
    <div class="job" role="button" tabindex="0" data-id="${escapeHtml(j.id)}">
      <div class="job-top">
        ${scoreHtml}
        <span class="job-pill ${j.company}">${escapeHtml(j.company_name || j.company)}</span>
        <span class="job-title">${escapeHtml(j.title)}</span>
        <span class="job-arrow">→</span>
      </div>
      <div class="job-meta">
        ${j.department ? `<span class="meta-dept">${escapeHtml(j.department)}</span>` : ''}
        ${j.category && j.category !== '其他' ? `<span>${escapeHtml(j.category)}</span>` : ''}
        ${j.location ? `<span>📍 ${escapeHtml(j.location)}</span>` : ''}
        ${j.posted_date ? `<span>${escapeHtml(j.posted_date)}</span>` : ''}
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('.job').forEach(el => {
    const id = el.dataset.id;
    el.addEventListener('click', () => openJobModal(id));
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openJobModal(id); }
    });
  });
}

// ── Wire up filter inputs ─────────────────────────────────────────────
let searchTimer;
$('searchInput').addEventListener('input', (e) => {
  state.filters.q = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { saveToUrl(); renderJobs(); }, 150);
});
$('catSelect').addEventListener('change', (e) => {
  state.filters.category = e.target.value;
  saveToUrl();
  renderJobs();
});
$('clearBtn').addEventListener('click', () => {
  state.filters.q = '';
  state.filters.companies.clear();
  state.filters.category = '';
  $('searchInput').value = '';
  $('catSelect').value = '';
  saveToUrl();
  renderChips();
  renderJobs();
});

// ── Data load ─────────────────────────────────────────────────────────
function loadData() {
  const btn = $('refreshBtn');
  btn.classList.add('spin');
  btn.disabled = true;
  return fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(data => {
      state.data = data || { jobs: [], companies: {}, categories: [] };
      if (!Array.isArray(state.data.jobs)) state.data.jobs = [];
      if (!state.data.companies) state.data.companies = {};
      if (!Array.isArray(state.data.categories)) state.data.categories = [];
      // Build IDF + per-job haystack once per data load.
      state.idf = buildIdf(state.data.jobs);
      // Always have an active resume — either the user's saved one or the
      // built-in default keywords. Pass null persist so we don't write the
      // default into localStorage.
      const userText = (localStorage.getItem('jobs.resume') || '').trim();
      applyResume(userText, false);
      renderHeader();
      renderStaleBanner();
      renderCategoryOptions();
      renderChips();
      renderJobs();
    })
    .catch(err => {
      console.error(err);
      $('metaUpdated').textContent = '数据加载失败';
      $('jobsList').innerHTML = '';
      $('emptyState').style.display = '';
      $('emptyState').innerHTML = '<span class="empty-emoji">⚠️</span><div>数据加载失败</div><div style="margin-top:6px;font-size:12px">' + escapeHtml(err.message) + '</div>';
    })
    .finally(() => {
      // Keep the spin visible briefly so the user sees feedback even on a fast cache hit.
      setTimeout(() => { btn.classList.remove('spin'); btn.disabled = false; }, 400);
    });
}

$('refreshBtn').addEventListener('click', loadData);

// ── Bootstrap ─────────────────────────────────────────────────────────
loadFromUrl();
$('searchInput').value = state.filters.q;
loadData();
</script>

</body>
</html>
